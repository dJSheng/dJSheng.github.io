<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>高中信息技术学考复习网</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
  /* ==================== 设计变量（与专题页完全一致） ==================== */
  :root{
    --primary:#2563eb; --primary-dark:#1e40af; --primary-light:#dbeafe;
    --bg:#f4f6fb; --card:#ffffff;
    --text:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --green:#059669; --orange:#ea580c; --purple:#7c3aed; --cyan:#06b6d4;
    --shadow-sm:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --shadow-md:0 6px 20px rgba(15,23,42,.09);
    --shadow-lg:0 14px 38px rgba(15,23,42,.13);
    --radius:16px;
    --pad:clamp(18px,4vw,26px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:#bfdbfe; color:#1e3a8a;}

  /* ==================== 通用布局 ==================== */
  .wrap{max-width:1180px; margin:0 auto; padding:0 var(--pad);}
  .band{padding:clamp(48px,7vw,76px) 0;}
  .band.alt{background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}

  /* 模块头：统一居中，对称稳定 */
  .mod-head{text-align:center; max-width:660px; margin:0 auto clamp(28px,4vw,42px);}
  .mod-head .eyebrow{
    display:inline-block; font-size:12.5px; font-weight:800; letter-spacing:2px;
    color:var(--primary); background:var(--primary-light);
    border-radius:999px; padding:4px 15px; margin-bottom:14px;
  }
  .mod-head h2{font-size:clamp(21px,3vw,28px); font-weight:800; color:var(--primary-dark); letter-spacing:.5px; line-height:1.4;}
  .mod-head p{margin-top:10px; font-size:14.5px; color:var(--muted);}

  /* ==================== 导航栏（与专题页一致） ==================== */
  .navbar{
    position:sticky; top:0; z-index:100;
    background:linear-gradient(135deg,#0f2a6b 0%, #1e40af 42%, #2563eb 74%, #3b82f6 100%);
    box-shadow:0 4px 24px rgba(30,64,175,.32);
  }
  .navbar .inner{
    max-width:1180px; margin:0 auto; padding:0 var(--pad);
    display:flex; align-items:center; gap:16px; height:58px;
  }
  .navbar .logo{display:flex; align-items:center; gap:9px; color:#fff; font-weight:800; font-size:16px; letter-spacing:.5px; white-space:nowrap;}
  .navbar .logo .lg-icon{
    width:30px; height:30px; border-radius:9px; font-size:15px; color:#fff;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.42);
    display:flex; align-items:center; justify-content:center;
  }
  .navbar .nav-links{display:flex; align-items:center; gap:4px; margin-left:auto;}
  .navbar .nav-links a{
    color:rgba(255,255,255,.86); font-size:14px; font-weight:600;
    padding:7px 14px; border-radius:9px; transition:.15s; white-space:nowrap;
  }
  .navbar .nav-links a:hover{background:rgba(255,255,255,.16); color:#fff;}
  .navbar .nav-links a.active{background:rgba(255,255,255,.22); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);}
  .navbar .menu-toggle{
    display:none; margin-left:auto; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.42); color:#fff; border-radius:9px;
    width:40px; height:37px; font-size:17px; cursor:pointer;
  }

  /* ==================== Hero（与专题页 header 同一套纹理） ==================== */
  .hero{
    color:#fff; text-align:center; position:relative; overflow:hidden;
    padding:clamp(54px,8vw,84px) 0 clamp(46px,6vw,64px);
    
  }
  .hero::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.13) 1px, transparent 1px); background-size:22px 22px;
  }
  .hero .wrap{position:relative; z-index:1;}
  .hero .tag{
    display:inline-block; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.45);
    border-radius:999px; padding:4px 16px; font-size:13px; backdrop-filter:blur(4px); margin-bottom:20px;
  }
  .hero h1{font-size:clamp(27px,4.4vw,40px); font-weight:800; letter-spacing:1px; text-shadow:0 2px 10px rgba(0,0,0,.22); line-height:1.35;}
  .hero h1 .hl{color:#7dd3fc;}
  .hero .lead{font-size:clamp(14.5px,1.8vw,16.5px); opacity:.95; margin-top:14px; max-width:620px; margin-inline:auto;}
  .hero .actions{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:30px;}
  .hero .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:800;
    border-radius:12px; padding:13px 30px; transition:.18s; border:1px solid transparent;
  }
  .btn-main{background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; box-shadow:0 6px 18px rgba(245,158,11,.4);}
  .btn-main:hover{transform:translateY(-2px); box-shadow:0 9px 24px rgba(245,158,11,.5);}
  .btn-sub{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.5); color:#fff; backdrop-filter:blur(4px);}
  .btn-sub:hover{background:rgba(255,255,255,.24); transform:translateY(-2px);}

 

  /* ==================== 响应式 ==================== */
  @media (max-width:860px){
    .navbar .menu-toggle{display:block;}
    .navbar .nav-links{
      display:none; position:absolute; top:58px; left:0; right:0; flex-direction:column;
      align-items:stretch; gap:2px; padding:10px var(--pad) 14px;
      background:linear-gradient(135deg,#1e40af,#2563eb); box-shadow:0 12px 24px rgba(30,64,175,.35);
    }
    .navbar .nav-links.open{display:flex;}
    .navbar .nav-links a{padding:11px 14px; font-size:15px;}
    .facts{grid-template-columns:repeat(2,1fr);}
    .step-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .step-grid{grid-template-columns:1fr;}
  }

   html,body {
height:100%;
background: radial-gradient(circle at 12% 18%, rgba(255, 255, 255, .16) 0, transparent 42%), radial-gradient(circle at 88% 85%, rgba(96, 165, 250, .4) 0, transparent 45%), linear-gradient(135deg, #0f2a6b 0%, #1e40af 42%, #2563eb 74%, #3b82f6 100%);
  }

</style>
</head>
<body>

<nav class="navbar">
  <div class="inner">
    <a class="logo" href="index.html"><span class="lg-icon">📘</span>高中信息技术学考复习网</a>
    <button class="menu-toggle" id="navToggle" aria-label="打开菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="active">首页</a>
      <a href="topic1.html">专题一 · 数据与信息</a>
      <a href="topic2.html">专题二 · 数据采集与处理</a>
    </div>
  </div>
</nav>

<!-- ==================== Hero ==================== -->
<header class="hero">
  <div class="wrap">
    <span class="tag">📘 高中信息技术 · 学业水平考试</span>
    <h1>信息技术<span class="hl">学考复习</span>资源中心</h1>
    <p class="lead">
      按教材专题编排的备考资源，涵盖知识精讲、真题精练、口诀速记与互动工具，帮助教师轻松授课、学生高效备考。
    </p>
    <div class="actions">
      <a class="btn btn-main" href="topic1.html">开始学习 →</a>
      <a class="btn btn-sub" href="#topics">浏览全部内容</a>
    </div>
  
  </div>
</header>





<script>
  /* 移动端导航开合 */
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a =>
    a.addEventListener('click', () => navLinks.classList.remove('open'))
  );

  /* 平滑滚动 */
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const el = document.querySelector(a.getAttribute('href'));
      if (el) { e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
    });
  });
</script>
</body>
</html>
