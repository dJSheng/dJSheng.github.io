<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式教学手册 · 网页设计与制作</title>
<link rel="stylesheet" href="assets/courseware-common.css">
<script src="assets/manifest.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #185FA5;
  --primary-dark: #0F4378;
  --primary-light: #E8F1FA;
  --bg: #F1EFE8;
  --bg-soft: #F8F7F4;
  --card: #FFFFFF;
  --border: #D3D1C7;
  --text: #2C2C2A;
  --text-sec: #5F5E5A;
  --text-hint: #888780;
  --success: #0F6E56;
  --danger: #A32D2D;
  --shadow: 0 2px 12px rgba(15,67,120,.08);
  --shadow-hover: 0 6px 24px rgba(15,67,120,.18);
  --radius: 12px;
}
body {
  font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-top: 0;
}

/* ====== Hero 区域 ====== */
.hero {
  background: linear-gradient(135deg, #0F4378 0%, #185FA5 50%, #2A7AC4 100%);
  color: #fff;
  padding: 70px 24px 56px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 18% 30%, rgba(255,255,255,.10) 0, transparent 38%),
    radial-gradient(circle at 82% 70%, rgba(255,255,255,.08) 0, transparent 42%);
  pointer-events: none;
}
.hero-inner { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.16);
  padding: 5px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; letter-spacing: .5px;
  margin-bottom: 18px;
}
.hero h1 {
  font-size: 40px; font-weight: 700; line-height: 1.2;
  letter-spacing: -0.5px; margin-bottom: 14px;
}
.hero p.lead {
  font-size: 16px; color: rgba(255,255,255,.85);
  max-width: 680px; margin-bottom: 26px;
}
.hero-stats {
  display: flex; gap: 32px; flex-wrap: wrap;
}
.hero-stat .num { font-size: 30px; font-weight: 700; line-height: 1; }
.hero-stat .lbl { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 4px; }

/* ====== 搜索栏 ====== */
.search-wrap {
  max-width: 1180px;
  margin: -28px auto 0;
  padding: 0 24px;
  position: relative;
  z-index: 2;
}
.search-box {
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow-hover);
  padding: 8px 8px 8px 18px;
  display: flex; align-items: center; gap: 12px;
}
.search-box svg { flex-shrink: 0; color: var(--text-hint); }
.search-box input {
  flex: 1; border: none; outline: none;
  font-size: 15px; padding: 12px 4px;
  font-family: inherit; background: transparent; color: var(--text);
}
.search-box input::placeholder { color: var(--text-hint); }
.search-box .count {
  font-size: 13px; color: var(--text-hint);
  padding: 0 14px; white-space: nowrap;
}
.search-box .kbd {
  font-size: 11px; color: var(--text-hint);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 2px 7px; background: var(--bg-soft);
}

/* ====== 主体容器 ====== */
.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* ====== 工具条 ====== */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 24px;
}
.toolbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.toolbar h2 {
  font-size: 20px; font-weight: 600; color: var(--text);
}
.progress-mini {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-sec);
}
.progress-mini .bar {
  width: 120px; height: 7px; background: var(--border);
  border-radius: 4px; overflow: hidden;
}
.progress-mini .fill {
  height: 100%; background: linear-gradient(90deg,#0F6E56,#28C840);
  width: 0; transition: width .4s;
}
.toolbar-right { display: flex; gap: 8px; }
.tool-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-sec); padding: 7px 14px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .18s;
}
.tool-btn:hover { border-color: var(--primary); color: var(--primary); }
.tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ====== 章节卡片 ====== */
.chapter {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 22px;
  overflow: hidden;
  border: 1px solid rgba(211,209,199,.5);
  transition: box-shadow .2s;
}
.chapter:hover { box-shadow: var(--shadow-hover); }
.chapter-head {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px;
  background: linear-gradient(90deg, var(--bg-soft), transparent);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.chapter-badge {
  width: 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.chapter-info { flex: 1; min-width: 0; }
.chapter-info .title {
  font-size: 17px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.chapter-info .desc { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
.chapter-meta {
  display: flex; align-items: center; gap: 14px;
  font-size: 12px; color: var(--text-hint); flex-shrink: 0;
}
.chapter-meta .chap-progress {
  display: inline-flex; align-items: center; gap: 6px;
}
.chapter-meta .mini-ring {
  width: 22px; height: 22px;
}
.chapter-toggle {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-hint); transition: transform .25s, background .18s;
}
.chapter.collapsed .chapter-toggle { transform: rotate(-90deg); }
.chapter-toggle:hover { background: var(--bg-soft); }

.chapter-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
  padding: 18px 22px 22px;
}
.chapter.collapsed .chapter-body { display: none; }

/* ====== 课件卡片 ====== */
.page-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 14px 14px 18px;
  background: var(--card);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column; gap: 6px;
  transition: all .2s;
  overflow: hidden;
}
.page-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--ch-color, var(--primary));
}
.page-card:hover {
  border-color: var(--ch-color, var(--primary));
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0,0,0,.08);
}
.page-card:active { transform: translateY(0); }
.page-card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.page-id {
  font-family: Consolas, monospace;
  font-size: 11px; font-weight: 700;
  color: var(--ch-color, var(--primary));
  background: var(--ch-bg, var(--primary-light));
  padding: 2px 8px; border-radius: 10px;
  letter-spacing: .5px;
}
.page-status {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .2s;
}
.page-status.done {
  background: var(--success); border-color: var(--success);
}
.page-status.done::after {
  content: "✓"; color: #fff; font-size: 11px; font-weight: 700;
}
.page-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  line-height: 1.4;
}
.page-knowledge {
  font-size: 12px; color: var(--text-sec);
  display: flex; align-items: center; gap: 5px;
}
.page-knowledge::before {
  content: "▸"; color: var(--text-hint); font-size: 10px;
}
.page-lesson {
  font-size: 11px; color: var(--text-hint);
  margin-top: 2px;
}

/* ====== 无结果 ====== */
.no-result {
  text-align: center; padding: 60px 20px;
  color: var(--text-hint);
}
.no-result .big { font-size: 40px; margin-bottom: 12px; }

/* ====== 页脚 ====== */
.footer {
  text-align: center; padding: 28px 20px 40px;
  color: var(--text-hint); font-size: 12px;
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
.footer kbd {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 6px; font-size: 11px;
  box-shadow: 0 1px 0 var(--border);
}

/* ====== 回到顶部 ====== */
.to-top {
  position: fixed; right: 24px; bottom: 24px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--primary); color: #fff;
  border: none; cursor: pointer; font-size: 20px;
  box-shadow: 0 4px 14px rgba(15,67,120,.35);
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 100;
}
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { transform: translateY(-3px); }

/* ====== 响应式 ====== */
@media (max-width: 720px) {
  .hero { padding: 48px 18px 44px; }
  .hero h1 { font-size: 28px; }
  .hero p.lead { font-size: 14px; }
  .hero-stats { gap: 20px; }
  .hero-stat .num { font-size: 24px; }
  .container { padding: 28px 14px 60px; }
  .chapter-body { grid-template-columns: 1fr; padding: 14px; }
  .chapter-head { padding: 14px; }
  .chapter-meta .chap-progress { display: none; }
}
</style>
</head>
<body>

<!-- ====== Hero ====== -->
<section class="hero">
  <div class="hero-inner">
    <span class="hero-eyebrow">📘 HTML5 + CSS3 + 网页布局</span>
    <h1>交互式教学手册</h1>
  
    <div class="hero-stats" id="heroStats">
      <div class="hero-stat"><div class="num" id="statPages">0</div><div class="lbl">交互课件</div></div>
      <div class="hero-stat"><div class="num" id="statChapters">0</div><div class="lbl">教学章节</div></div>
    </div>
  </div>
</section>

<!-- ====== 搜索 ====== -->
<div class="search-wrap">
  <div class="search-box">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索课件：输入标题、知识点、编号（如 P05、flex、选择器）…">
    <span class="kbd">/</span>
    <span class="count" id="searchCount"></span>
  </div>
</div>

<!-- ====== 主体 ====== -->
<div class="container">
  <div class="toolbar">
    <div class="toolbar-left">
      <h2>📂 课件目录</h2>
    </div>
    <div class="toolbar-right">
      <button class="tool-btn" id="btnExpandAll">展开全部</button>
      <button class="tool-btn" id="btnCollapseAll">折叠全部</button>
    </div>
  </div>
  <div id="chapters"></div>
  <div class="no-result" id="noResult" style="display:none;">
    <div class="big">🔍</div>
    <div>没有找到匹配的课件，换个关键词试试</div>
  </div>
</div>

<button class="to-top" id="toTop" title="回到顶部">↑</button>

<!-- ====== 页脚 ====== -->
<div class="footer">
  <div>使用提示：点击卡片进入课件 · 课件内可用 <kbd>←</kbd> <kbd>→</kbd> 键快速翻页 · 点击左上角 logo 回到此目录</div>
  <div style="margin-top:6px;">交互式教学手册 · 网页设计与制作课程</div>
</div>

<script>
var MANIFEST = null;
var STORAGE_KEY = 'cw-progress-v1';

function loadManifest(cb) {
  // 直接读取由 <script src="assets/manifest.js"> 注入的全局变量
  // 这样在 file:// 协议下双击打开也能正常工作（无需本地服务器）
  MANIFEST = window.CW_MANIFEST || null;
  cb();
}

function getProgress() {
  try {
    var v = localStorage.getItem(STORAGE_KEY);
    return v ? JSON.parse(v) : {};
  } catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
}
function markDone(path) {
  var p = getProgress();
  p[path] = true;
  saveProgress(p);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function lightenHex(hex, amt) {
  // 简单变浅：转 rgb 后混入白色
  var h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function render(filter) {
  filter = (filter || '').trim().toLowerCase();
  var wrap = document.getElementById('chapters');
  wrap.innerHTML = '';
  var progress = getProgress();
  var totalShown = 0;

  MANIFEST.chapters.forEach(function (ch, chIdx) {
    // 过滤
    var pages = ch.pages.filter(function (p) {
      if (!filter) return true;
      var hay = (p.id + ' ' + p.title + ' ' + p.knowledge + ' ' + p.lesson + ' ' + ch.title).toLowerCase();
      return hay.indexOf(filter) !== -1;
    });
    if (pages.length === 0) return;

    totalShown += pages.length;

    var doneCount = pages.filter(function (p) { return progress[p.path]; }).length;

    var chap = document.createElement('section');
    chap.className = 'chapter';
    chap.dataset.ch = ch.id;
    chap.style.setProperty('--ch-color', ch.color);

    var head = document.createElement('div');
    head.className = 'chapter-head';
    head.innerHTML =
      '<div class="chapter-badge" style="background:' + ch.color + '">' + (chIdx + 1) + '</div>' +
      '<div class="chapter-info">' +
        '<div class="title">' + esc(ch.title) + '</div>' +
        '<div class="desc">' + esc(ch.desc) + '</div>' +
      '</div>' +
      '<div class="chapter-meta">' +
        '<span>' + pages.length + ' 个课件</span>' +
        '<span class="chapter-toggle">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</span>' +
      '</div>';
    head.addEventListener('click', function () { chap.classList.toggle('collapsed'); });
    chap.appendChild(head);

    var body = document.createElement('div');
    body.className = 'chapter-body';
    pages.forEach(function (p) {
      var card = document.createElement('a');
      card.className = 'page-card';
      card.href = p.path;
      card.style.setProperty('--ch-color', ch.color);
      card.style.setProperty('--ch-bg', lightenHex(ch.color, 0.82));
      card.innerHTML =
        '<div class="page-card-head">' +
          '<span class="page-id">' + esc(p.id) + '</span>' +
        '</div>' +
        '<div class="page-title">' + esc(p.title) + '</div>' +
        '<div class="page-knowledge">' + esc(p.knowledge) + '</div>';
      body.appendChild(card);
    });
    chap.appendChild(body);
    wrap.appendChild(chap);
  });

  document.getElementById('noResult').style.display = totalShown === 0 ? 'block' : 'none';
  document.getElementById('searchCount').textContent = filter ? ('匹配 ' + totalShown + ' 个') : '';
  updateGlobalStats();
}

function miniRing(done, total, color) {
  var pct = total === 0 ? 0 : Math.round(done / total * 100);
  var r = 8, c = 2 * Math.PI * r;
  var off = c * (1 - pct / 100);
  return '<svg class="mini-ring" viewBox="0 0 22 22">' +
    '<circle cx="11" cy="11" r="' + r + '" fill="none" stroke="#D3D1C7" stroke-width="3"/>' +
    '<circle cx="11" cy="11" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="3" ' +
      'stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" ' +
      'transform="rotate(-90 11 11)" stroke-linecap="round"/>' +
    '</svg>';
}

function updateGlobalStats() {
  var all = [];
  MANIFEST.chapters.forEach(function (ch) { (ch.pages || []).forEach(function (p) { all.push(p); }); });

  document.getElementById('statPages').textContent = all.length;
  document.getElementById('statChapters').textContent = MANIFEST.chapters.length;
}

function init() {
  loadManifest(function () {
    if (!MANIFEST) {
      document.getElementById('chapters').innerHTML = '<div class="no-result"><div class="big">⚠️</div><div>无法加载 manifest.json，请通过本地服务器访问。</div></div>';
      return;
    }
    render('');

    var input = document.getElementById('searchInput');
    var timer = null;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { render(input.value); }, 120);
    });

    document.getElementById('btnExpandAll').addEventListener('click', function () {
      document.querySelectorAll('.chapter').forEach(function (c) { c.classList.remove('collapsed'); });
    });
    document.getElementById('btnCollapseAll').addEventListener('click', function () {
      document.querySelectorAll('.chapter').forEach(function (c) { c.classList.add('collapsed'); });
    });

    // 快捷键：/ 聚焦搜索
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); input.focus();
      }
      if (e.key === 'Escape' && document.activeElement === input) {
        input.value = ''; render(''); input.blur();
      }
    });

    // 回到顶部
    var toTop = document.getElementById('toTop');
    window.addEventListener('scroll', function () {
      toTop.classList.toggle('show', window.scrollY > 400);
    });
    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else { init(); }
</script>
</body>
</html>
